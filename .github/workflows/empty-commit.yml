name: Add Empty Commit

on:
  workflow_call:
    inputs:
      branch:
        description: 'Target branch (default: main)'
        required: false
        type: string
        default: 'main'
    secrets:
      commit_author:
        description: 'Commit author in format "Name <email>"'
        required: true
      commit_message:
        description: 'Commit message'
        required: true
      token:
        description: 'GitHub token with write permissions'
        required: false

jobs:
  add-empty-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create empty commit
        run: |
          git commit --allow-empty --author "${{ secrets.commit_author }}" -m "${{ secrets.commit_message }}"
      
      - name: Push changes
        run: |
          git push origin ${{ inputs.branch }}
